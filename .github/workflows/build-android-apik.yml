name: Build Android APK

on:
  workflow_dispatch:

permissions: read-all

env:
  # Keep this in sync with release.yml.
  ENABLE_TAURI_SIGNING: 'false'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: setup Java (for Android build only)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # The legacy "tools" package was removed from the SDK repository.
          packages: platform-tools

      - name: install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @poxenstudio/myreader setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: ubuntu-latest-android-aarch64-cargo

      - name: create .env.local file for Next.js
        run: |
          echo "NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          cp .env.local app/.env.local

      - name: build signed Android arm64 apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd app/
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          # Reapply the native-bridge store flavor resolution required by the
          # generated Android project, as in release.yml.
          sed -i '/defaultConfig {/a\        missingDimensionStrategy("store", "foss", "googleplay")' src-tauri/gen/android/app/build.gradle.kts
          # Allow user-configured plain-HTTP servers in release builds.
          sed -i '0,/manifestPlaceholders\["usesCleartextTraffic"\] = "false"/s//manifestPlaceholders["usesCleartextTraffic"] = "true"/' src-tauri/gen/android/app/build.gradle.kts
          pnpm tauri icon ../data/icons/myreader-book.png
          git checkout .

          pushd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

          # Tauri's generated Gradle template doesn't connect keystore.properties
          # to the release build type, so wire the signing config after each init.
          perl -0777 -pi -e 's/android \{\r?\n/android {\n    signingConfigs {\n        create("release") {\n            val keystorePropertiesFile = rootProject.file("keystore.properties")\n            if (keystorePropertiesFile.exists()) {\n                val keystoreProperties = Properties()\n                keystoreProperties.load(keystorePropertiesFile.inputStream())\n                keyAlias = keystoreProperties.getProperty("keyAlias")\n                keyPassword = keystoreProperties.getProperty("password")\n                storeFile = file(keystoreProperties.getProperty("storeFile"))\n                storePassword = keystoreProperties.getProperty("password")\n            }\n        }\n    }\n/' app/build.gradle.kts
          sed -i '/getByName("release") {/a\            signingConfig = signingConfigs.getByName("release")' app/build.gradle.kts
          popd

          version=$(node -p "require('./package.json').version")
          apk_path=src-tauri/gen/android/app/build/outputs/apk/universal/release
          apk_file="MyReader_${version}_android_arm64.apk"
          pnpm tauri android build -t aarch64

          apk_src=$(ls -t "$apk_path"/app-universal-release*.apk 2>/dev/null | head -n1)
          if [ -z "$apk_src" ]; then
            echo "::error::No arm64 APK found under $apk_path after build"
            exit 1
          fi
          if [[ "$apk_src" == *-unsigned.apk ]]; then
            echo "::error::Android release APK is unsigned; check the ANDROID_KEY_* secrets and signing configuration"
            exit 1
          fi
          cp "$apk_src" "$apk_file"

          if [ "$ENABLE_TAURI_SIGNING" = "true" ]; then
            pnpm tauri signer sign "$apk_file"
          else
            echo "Skipping Tauri updater signature: ENABLE_TAURI_SIGNING is false"
          fi

      - name: upload Android arm64 apk artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MyReader-android-arm64
          path: app/MyReader_*_android_arm64.apk
          if-no-files-found: error

      - name: upload Tauri updater signature artifact
        if: env.ENABLE_TAURI_SIGNING == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MyReader-android-arm64-signature
          path: app/MyReader_*_android_arm64.apk.sig
          if-no-files-found: error
